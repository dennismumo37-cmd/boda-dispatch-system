<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juja Boda Boda Uber App</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 480px; 
            margin: 0 auto; 
            padding: 10px; 
            background: linear-gradient(135deg, #fef08a 0%, #f97316 100%); 
            min-height: 100vh;
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); 
            margin-bottom: 20px;
        }
        .banner {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            height: 160px;
            margin-bottom: 20px;
            background: #1e293b;
        }
        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }
        .banner-text {
            position: absolute;
            bottom: 12px;
            left: 15px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .banner-text h1 { font-size: 22px; margin: 0; }
        .banner-text p { font-size: 13px; margin: 3px 0 0 0; color: #fde047; font-weight: bold; }
        
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 13px; color: #334155; }
        input, select, button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            border-radius: 8px; 
            border: 1px solid #cbd5e1; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
        }
        button { 
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); 
            color: white; 
            font-weight: bold; 
            border: none; 
            margin-top: 22px; 
            cursor: pointer; 
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: transform 0.1s ease;
        }
        button:active { transform: scale(0.98); }
        button:hover { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }
        
        #status { 
            margin-top: 20px; 
            padding: 16px; 
            border-radius: 8px; 
            display: none; 
            text-align: center; 
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="banner">
            <!-- Professional, high-speed motorcycle stock photo -->
            <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=600&q=80" alt="Boda Boda Motorcycle">
            <div class="banner-text">
                <h1>Juja Boda Boda Uber</h1>
                <p>⚡ Fast, Safe & Reliable Dispatches</p>
            </div>
        </div>

        <div id="bookingForm">
            <label for="station">Select Nearest Stage / Station</label>
            <select id="station">
                <option value="">Loading official stages...</option>
            </select>

            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="e.g., Dennis Mumo" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g., 0712345678" required>

            <label for="pickup">Exact Pickup Point (Juja Location)</label>
            <select id="pickup">
                <option value="">-- Select Common Location --</option>
                <option value="Gate C">Gate C</option>
                <option value="Gate B">Gate B</option>
                <option value="Kwa Jose">Kwa Jose</option>
                <option value="Supermetro Stage">Supermetro Stage</option>
                <option value="Mantara Stage">Mantara Stage</option>
                <option value="Cooperative">Cooperative</option>
                <option value="Old Uchumi">Old Uchumi</option>
                <option value="Juja Square">Juja Square</option>
                <option value="Senate">Senate</option>
                <option value="Ankai">Ankai</option>
                <option value="Backers">Backers</option>
                <option value="The Haven">The Haven</option>
                <option value="Bomblast">Bomblast</option>
                <option value="The Promise Land">The Promise Land</option>
                <option value="The Promise House">The Promise House</option>
                <option value="NewLands">NewLands</option>
                <option value="Golden View">Golden View</option>
                <option value="Springvale">Springvale</option>
                <option value="KK Towers">KK Towers</option>
                <option value="Seven Sunday">Seven Sunday</option>
                <option value="Hotel Lilie">Hotel Lilie</option>
                <option value="Sewage">Sewage</option>
                <option value="Gas Man">Gas Man</option>
                <option value="Gashororo Primary">Gashororo Primary</option>
                <option value="Centurion">Centurion</option>
                <option value="HighPoint">HighPoint</option>
            </select>

            <label for="destination">Where are you going?</label>
            <input type="text" id="destination" placeholder="e.g., Juja City Mall / Specific Building" required>

            <button onclick="bookRide()">Request Boda Now 🏍️</button>
        </div>
        <div id="status"></div>
    </div>

    <script>
        const API_URL = "https://boda-dispatch-system.onrender.com";
        let pollInterval = null;
        let currentRideId = null;

        async function loadStations() {
            const select = document.getElementById("station");
            try {
                const res = await fetch(`${API_URL}/stations`);
                const stations = await res.json();
                select.innerHTML = '<option value="">-- Choose Stage / Station --</option>';
                if (stations.length === 0) {
                    select.innerHTML = '<option value="">No stations found (Add via backend)</option>';
                    return;
                }
                stations.forEach(st => {
                    const opt = document.createElement("option");
                    opt.value = st.id;
                    opt.textContent = `${st.name} — (${st.landmark})`;
                    select.appendChild(opt);
                });
            } catch (err) {
                select.innerHTML = '<option value="">Error loading stations (Server waking up...)</option>';
            }
        }

        async function bookRide() {
            const statusDiv = document.getElementById("status");
            const stationId = document.getElementById("station").value;
            const passengerName = document.getElementById("name").value;
            const passengerPhone = document.getElementById("phone").value;
            const pickupLocation = document.getElementById("pickup").value;
            const destination = document.getElementById("destination").value;

            if (!stationId || !passengerName || !passengerPhone || !pickupLocation || !destination) {
                alert("Please fill in all required fields and select your pickup location.");
                return;
            }

            const payload = {
                station_id: parseInt(stationId),
                passenger_name: passengerName,
                passenger_phone: passengerPhone,
                pickup_location: pickupLocation,
                destination: destination
            };

            statusDiv.style.display = "block";
            statusDiv.style.background = "#fef08a";
            statusDiv.style.color = "#854d0e";
            statusDiv.textContent = "⏳ Broadcasting request to nearby Juja riders...";

            try {
                const res = await fetch(`${API_URL}/rides`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                currentRideId = data.id || data.request_id;

                document.getElementById("bookingForm").style.display = "none";
                statusDiv.style.background = "#e0f2fe";
                statusDiv.style.color = "#0369a1";
                statusDiv.textContent = "🔍 Request sent successfully! Waiting for a rider to accept...";

                // Poll status every 4 seconds for approval/denial notifications
                pollInterval = setInterval(checkRideStatus, 4000);
            } catch (err) {
                statusDiv.style.background = "#fee2e2";
                statusDiv.style.color = "#991b1b";
                statusDiv.textContent = "❌ Failed to submit request. Check your connection.";
            }
        }

        async function checkRideStatus() {
            if (!currentRideId) return;
            try {
                const res = await fetch(`${API_URL}/rides/${currentRideId}`);
                const ride = await res.json();
                const statusDiv = document.getElementById("status");
                const status = ride.status || "Pending";

                if (status === "Approved" || status === "Accepted") {
                    clearInterval(pollInterval);
                    statusDiv.style.background = "#dcfce7";
                    statusDiv.style.color = "#166534";
                    statusDiv.innerHTML = "✅ <strong>Ride Approved!</strong> Your rider has accepted the trip and is speeding to your pickup point.";
                } else if (status === "Denied") {
                    clearInterval(pollInterval);
                    statusDiv.style.background = "#fee2e2";
                    statusDiv.style.color = "#991b1b";
                    statusDiv.innerHTML = "❌ <strong>Ride Denied</strong> Riders at this stage are currently busy. Please try another stage.";
                }
            } catch (err) {
                console.error("Polling error", err);
            }
        }

        loadStations();
    </script>
</body>
</html>
